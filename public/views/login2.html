<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two-Factor Authentication - Vulnerable 2FA Lab</title>
    <link href="/css/tailwind.css" rel="stylesheet">
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-12">
      <div class="bg-white shadow-sm border border-gray-100 rounded-xl p-8 max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-2 text-center text-gray-900">Two-Factor Authentication</h1>
        <p class="mb-8 text-gray-500 text-center leading-relaxed">
          A verification code has been sent to your email. Enter it below to complete your login.
        </p>
        
        <form action="/login2" method="post">
          <div class="mb-8">
            <label for="mfa-code" class="block text-sm font-medium text-gray-700 text-center mb-2">
              Verification Code
            </label>
            <input
              type="text"
              id="mfa-code"
              name="mfa-code"
              required
              class="block w-full rounded-md border border-gray-200 text-gray-900 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none p-3 text-center text-2xl tracking-widest"
              maxlength="4"
              autocomplete="one-time-code"
            />
          </div>
          <div class="flex justify-center">
            <button
              type="submit"
              class="py-3 px-6 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
              Verify
            </button>
          </div>
        </form>
        
        <div class="mt-6 text-center">
          <a href="/login" class="text-sm text-blue-600 hover:text-blue-800">Back to login</a>
        </div>
        
        <p class="text-center text-gray-400 text-xs mt-8">Web Security 2025</p>
      </div>
    </div>
  </body>
</html>
