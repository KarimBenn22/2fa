<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two-Factor Authentication - Vulnerable 2FA Lab</title>
    <link href="/css/tailwind.css" rel="stylesheet">
    <link href="/css/soft-reset.css" rel="stylesheet">
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-12">
      <div class="rounded-xl p-8 max-w-md mx-auto space-y-4">
        <div class="w-full flex items-center justify-center">
          <img src="/logo.png" alt="Lab logo" width="100" height="140">
        </div>
        <p class="text-gray-500 text-center leading-relaxed">
          A verification code has been sent to your email. Enter it below to complete your login.
        </p>
        <form action="/login2" method="post" class="space-y-4">
          <div class="">
            <label for="mfa-code" class="block text-sm font-medium text-gray-700 text-center mb-2">
              Verification Code
            </label>
            <input
              type="text"
              id="mfa-code"
              name="mfa-code"
              required
              class="w-full text-sm text-center text-2xl tracking-widest"
              maxlength="4"
              autocomplete="one-time-code"
            />
          </div>
          <div class="flex justify-center">
            <button
              type="submit"
              class="w-full text-sm"
            >
              Verify
            </button>
          </div>
        </form>
        <div class="text-center">
          <a href="/login" class="text-sm text-blue-600 hover:text-blue-800">Back to login</a>
        </div>
        <p class="text-center text-gray-400 text-xs">Web Security 2025</p>
      </div>
    </div>
  </body>
</html>
