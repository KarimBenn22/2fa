<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two-Factor Authentication - Vulnerable 2FA Lab</title>
    <link rel="stylesheet" href="/css/tailwind.css" />
  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-12">
      <div class="bg-gray-800 shadow-xl rounded-lg p-8 max-w-md mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">Two-Factor Authentication</h1>
        <p class="mb-8 text-gray-300 text-center leading-relaxed">
          Hey target, a verification code has been sent to your email. Enter it below to complete
          your login.
        </p>

        <form action="/login2" method="post">
          <div class="mb-8">
            <label for="mfa-code" class="block text-sm font-medium text-gray-300 text-center">
              Verification Code
            </label>
            <input
              type="text"
              id="mfa-code"
              name="mfa-code"
              required
              class="mt-3 block w-full rounded-md bg-gray-700 border-gray-600 text-gray-100 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50 p-3 text-center text-2xl tracking-widest"
              maxlength="4"
            />
            <input type="hidden" id="verify" name="verify" />
          </div>
          <div class="flex justify-center">
            <button
              type="submit"
              class="py-3 px-6 bg-blue-600 text-white font-semibold rounded-md shadow-lg hover:bg-blue-700 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75"
            >
              Verify
            </button>
          </div>
        </form>

        <p class="text-center text-gray-500 text-sm mt-6">Web Security 2025</p>
      </div>
    </div>
  </body>
  <script>
    document.getElementById('verify').value = new URLSearchParams(window.location.search).get(
      'verify'
    );
  </script>
</html>
