<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Vulnerable 2FA Lab</title>
    <link rel="stylesheet" href="/css/tailwind.css" />
  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-12">
      <div class="bg-gray-800 shadow-xl rounded-lg p-8 max-w-md mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">Login</h1>
        <p class="text-center text-gray-400 mb-8">Welcome back, target</p>

        <form action="/login" method="post">
          <div class="mb-6">
            <label for="username" class="block text-sm font-medium text-gray-300">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              class="mt-2 block w-full rounded-md bg-gray-700 border-gray-600 text-gray-100 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50 p-2"
            />
          </div>
          <div class="mb-8">
            <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              class="mt-2 block w-full rounded-md bg-gray-700 border-gray-600 text-gray-100 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50 p-2"
            />
          </div>
          <div class="flex items-center justify-between">
            <button
              type="submit"
              class="py-3 px-6 bg-blue-600 text-white font-semibold rounded-md shadow-lg hover:bg-blue-700 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75"
            >
              Login
            </button>
            <a
              href="/register"
              class="text-sm text-blue-400 hover:text-blue-300 transition duration-200"
              >Need an account?</a
            >
          </div>
        </form>

        <p class="text-center text-gray-500 text-sm mt-6">Web Security 2025</p>
      </div>
    </div>
  </body>
</html>
