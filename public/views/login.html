<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Vulnerable 2FA Lab</title>
    <link href="/css/tailwind.css" rel="stylesheet">
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-12">
      <div class="bg-white shadow-sm border border-gray-100 rounded-xl p-8 max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-2 text-center text-gray-900">Login</h1>
        <p class="text-center text-gray-500 mb-8">Welcome back, please sign in</p>

        <form action="/login" method="post">
          <div class="mb-5">
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              class="block w-full rounded-md border border-gray-200 px-4 py-3 text-gray-900 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none text-sm"
              placeholder="Enter your username"
            />
          </div>
          <div class="mb-6">
            <div class="flex items-center justify-between mb-1">
              <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
              <a href="/forgot-password" class="text-xs text-blue-600 hover:text-blue-800">Forgot password?</a>
            </div>
            <input
              type="password"
              id="password"
              name="password"
              required
              class="block w-full rounded-md border border-gray-200 px-4 py-3 text-gray-900 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none text-sm"
              placeholder="Enter your password"
            />
          </div>
          <div class="mb-6">
            <button
              type="submit"
              class="w-full py-3 px-4 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm"
            >
              Sign in
            </button>
          </div>
          <div class="text-center">
            <a
              href="/register"
              class="text-sm text-blue-600 hover:text-blue-800 font-medium"
              >Don't have an account? Create one</a>
          </div>
        </form>

        <p class="text-center text-gray-400 text-xs mt-8">Web Security 2025</p>
      </div>
    </div>
  </body>
</html>
