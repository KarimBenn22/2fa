<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Vulnerable 2FA Lab</title>
    <link href="/css/tailwind.css" rel="stylesheet">
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-12">
      <div class="rounded-xl p-8 max-w-md mx-auto">
        <div class="w-full flex items-center justify-center">
          <img src="/logo.png" alt="Lab logo" width="100" height="140">
        </div>
        <form action="/register" method="post">
          <div class="mb-5">
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              class="w-full text-sm"
              placeholder="Choose a username"
            />
          </div>
          
          <div class="mb-5">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              class="w-full text-sm"
              placeholder="Create a password"
            />
          </div>
          
          <div class="mb-6">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              class="w-full text-sm"
              placeholder="Enter your email"
            />
          </div>
          
          <div class="mb-6">
            <button
              type="submit"
              class="w-full text-sm"
            >
              Sign up
            </button>
          </div>
          
          <div class="text-center">
            <a
              href="/login"
              class="text-sm text-blue-600 hover:text-blue-800 font-medium"
            >
              Already have an account? Sign in
            </a>
          </div>
        </form>

        <p class="text-center text-gray-400 text-xs mt-8">Web Security 2025</p>
      </div>
    </div>
  </body>
</html>
