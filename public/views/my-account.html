<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account - Vulnerable 2FA Lab</title>
    <link rel="stylesheet" href="/css/tailwind.css" />
    <script src="/js/main.js" defer></script>
  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-12">
      <div class="bg-gray-800 shadow-xl rounded-lg p-8 max-w-md mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">My Account</h1>
        <div class="mb-8">
          <p class="text-lg text-center">
            Welcome, <span id="username" class="font-bold text-blue-300"></span>!
          </p>
        </div>
        <div class="p-4 bg-yellow-900 border border-yellow-600 text-yellow-200 rounded mb-8">
          <p class="font-bold">Account Information:</p>
          <p>
            Email: <span id="email" class="font-bold text-blue-300"></span><br />
            Name: <span id="name" class="font-bold text-blue-300"></span><br />
          </p>
          <div class="target"></div>
        </div>
        <div class="flex justify-center">
          <a
            href="/logout"
            class="py-3 px-6 bg-red-600 text-white font-semibold rounded-md shadow-lg hover:bg-red-700 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-75"
          >
            Logout
          </a>
        </div>
        <p class="text-center text-gray-500 text-sm mt-6">Web Security 2025</p>
      </div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        try {
          const response = await fetch('/user/user-info', {
            method: 'POST',
          });
          const data = await response.json();
          const { username, email, name } = data.username;
          document.getElementById('username').textContent = username || 'target';
          document.getElementById('email').textContent = email || 'target';
          document.getElementById('name').textContent = name || 'target';

          if (username.toLowerCase() === 'sam') {
            const successElement = document.createElement('div');
            successElement.className =
              'mt-6 p-4 bg-green-900 border border-green-600 text-green-200 rounded';
            successElement.textContent =
              'Congratulations! You have successfully exploited the vulnerable 2FA implementation!';
            document.querySelector('.target').appendChild(successElement);
          }
        } catch (error) {
          console.error('Failed to fetch user info:', error);
        }
      });
    </script>
  </body>
</html>
