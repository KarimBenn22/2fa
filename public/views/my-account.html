<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account - Vulnerable 2FA Lab</title>
    <link href="/css/tailwind.css" rel="stylesheet"> 
    <script src="/js/main.js" defer></script>
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-12">
      <div class="bg-white shadow-sm border border-gray-100 rounded-xl p-8 max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-2 text-center text-gray-900">My Account</h1>
        <div class="mb-6">
          <p class="text-lg text-center text-gray-600">
            Welcome, <span id="username" class="font-bold text-blue-600"></span>!
          </p>
        </div>
        
        <div class="p-5 bg-blue-50 border border-blue-100 text-gray-700 rounded-lg mb-8">
          <p class="font-medium text-gray-900 mb-2">Account Information:</p>
          <p class="space-y-1">
            <span class="block">Email: <span id="email" class="font-medium text-blue-600"></span></span>
            <span class="block">Name: <span id="name" class="font-medium text-blue-600"></span></span>
          </p>
          <div class="target mt-4"></div>
        </div>
        
        <div class="flex justify-center">
          <a
            href="/logout"
            class="py-3 px-6 bg-gray-100 text-gray-700 font-medium rounded-md border border-gray-200 hover:bg-gray-200 transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
          >
            Logout
          </a>
        </div>
        
        <p class="text-center text-gray-400 text-xs mt-8">Web Security 2025</p>
      </div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        try {
          const response = await fetch('/user/user-info', {
            method: 'POST',
          });
          const data = await response.json();
          const { username, email, name } = data.username;
          document.getElementById('username').textContent = username || 'User';
          document.getElementById('email').textContent = email || 'user@example.com';
          document.getElementById('name').textContent = name || 'User';

          if (username.toLowerCase() === 'sam') {
            const successElement = document.createElement('div');
            successElement.className =
              'mt-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-md';
            successElement.textContent =
              'Congratulations! You have successfully exploited the vulnerable 2FA implementation!';
            document.querySelector('.target').appendChild(successElement);
          }
        } catch (error) {
          console.error('Failed to fetch user info:', error);
        }
      });
    </script>
  </body>
</html>
